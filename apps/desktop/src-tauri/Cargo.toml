[package]
name = "sherpa-desktop"
version = "0.1.0"
description = "Sherpa AI desktop app"
edition = "2021"
publish = false

[lib]
name = "sherpa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-opener = "=2.7.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
