# Full stack locally: Postgres with pgvector, the API (migrates on startup) and the web app.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sherpa}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sherpa}
      - POSTGRES_DB=${POSTGRES_DB:-sherpa}
    ports:
      - "5432:5432"
    volumes:
      - sherpa-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sherpa}"]
      interval: 3s
      retries: 20
  api:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-sherpa}:${POSTGRES_PASSWORD:-sherpa}@db:5432/${POSTGRES_DB:-sherpa}
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_FALLBACK_MODELS=${LLM_FALLBACK_MODELS:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_PROJECT_ID=${OPENAI_PROJECT_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-amazon.nova-2-multimodal-embeddings-v1:0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-change-me}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Sherpa AI}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sherpa-pg:
