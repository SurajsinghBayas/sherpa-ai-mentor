# Desktop installers: builds the Tauri app (apps/desktop) natively on Windows and macOS.
# Download them from the run's "Artifacts". The apps call the production API (https://sherpa-ai.tech)
# unless the repository variable SHERPA_API_URL names another.
name: desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/web/**"
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: msi,nsis
            files: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-14
            name: macos-arm64
            bundles: app,dmg
            files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      SHERPA_API_URL: ${{ vars.SHERPA_API_URL || 'https://sherpa-ai.tech' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install dependencies
        shell: bash
        run: |
          (cd apps/web && (npm ci || npm install))
          (cd apps/desktop && npm ci)
      - name: Build
        working-directory: apps/desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-ai-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
