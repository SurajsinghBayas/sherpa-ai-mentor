# iOS app (apps/mobile, Capacitor): an unsigned .ipa built on a macOS runner, since building needs
# Xcode. Download it from the run's "Artifacts". It must be signed before an iPhone will install it:
# sideload it with your Apple ID (Sideloadly or AltStore re-sign it), or add signing with an Apple
# Developer account. The app calls the production API (https://sherpa-ai.tech) unless the
# repository variable SHERPA_API_URL names another.
name: ios
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/web/**"
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      SHERPA_API_URL: ${{ vars.SHERPA_API_URL || 'https://sherpa-ai.tech' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # Capacitor 8 CLI needs Node 22+
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
      - name: Use the newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install dependencies
        run: |
          (cd apps/web && npm ci)
          (cd apps/mobile && npm ci)
      - name: Export the web app and copy it into the iOS project
        working-directory: apps/mobile
        run: npm run web && npx cap sync ios
      - name: Build (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the .ipa
        working-directory: apps/mobile/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "Sherpa-AI-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-ai-ios
          path: apps/mobile/ios/App/Sherpa-AI-unsigned.ipa
          if-no-files-found: error
